# ESP32-C3 CRSF Bridge (no RF radio – wired TX+RX proxy)
# Hardware: ESP32-C3 Supermini
#   GPIO  1 : S.PORT  – half-duplex CRSF to/from EdgeTX radio (400 kbaud)
#   GPIO 20 : FC RX   – CRSF from flight controller           (420 kbaud)
#   GPIO 21 : FC TX   – CRSF to flight controller             (420 kbaud)

[env:ESP32C3_CRSF_Bridge]
extends = env_common_esp32c3rx, radio_2400
# NOTE: radio_2400 is extended here solely to inherit -DRADIO_SX128X=1,
# which is required to pass the compile-time radio-type check in targets.h.
# No SX1280 radio hardware is present on this target; the radio driver and
# all related libraries are listed in lib_ignore below.
board_build.f_cpu = 160000000L
build_flags =
	${env_common_esp32c3rx.build_flags}
	${radio_2400.build_flags}
	${common_env_data.build_flags_rx}
	-include target/CRSF_Bridge.h
	-D VTABLES_IN_FLASH=1
	-O2
# Only compile the bridge firmware – exclude all TX/RX main sources.
build_src_filter = -<*> +<bridge_main.cpp>
# Exclude radio drivers, OTA, and peripherals unused by the bridge.
lib_ignore =
	Backpack
	GSENSOR
	SCREEN
	Thermal
	VTX
	VTXSPI
	SX127xDriver
	SX1280Driver
	SX12xxDriverCommon
	LR1121Driver
	FHSS
	OTA
	tx-crsf
	rx-crsf
	StubbornSender
	StubbornReceiver
	TelemetryProtocol
	RFAMP
	LBT
lib_deps = ${env_common_esp32rx.lib_deps}

